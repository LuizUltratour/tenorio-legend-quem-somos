<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quem Somos — Tenório Legend</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #434040;
      --dark: #F2EBDD;
      --text-soft: rgba(242,235,221,0.78);
      --border: rgba(242,235,221,0.22);
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg) url(assets/bg.png) center/cover no-repeat fixed;
      color: var(--dark);
      font-family: var(--font-sans);
    }

    /* ── CLOSE ── */
    #btn-close {
      position: fixed;
      top: 16px; right: 24px;
      z-index: 10;
      width: 45px; height: 45px;
      padding: 0;
      border: none;
      cursor: pointer;
      background: url(assets/close.png) center/100% 100% no-repeat;
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    @media (hover: hover) { #btn-close:hover { filter: brightness(1.25); transform: scale(1.06); } }
    #btn-close:active { filter: brightness(1.25); transform: scale(0.96); }

    /* ── SCROLL ── */
    #qs-scroll {
      height: 100vh;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    #qs-scroll::-webkit-scrollbar { width: 5px; }
    #qs-scroll::-webkit-scrollbar-track { background: transparent; }
    #qs-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 40px; }

    /* ── QUEM SOMOS (construtora) ── */
    #construtora {
      text-align: center;
      padding: 90px 0 70px;
      max-width: 760px;
      margin: 0 auto;
    }
    #construtora h1, .titulo-pessoas {
      font-family: var(--font-serif);
      font-weight: 400;
      letter-spacing: 0.04em;
    }
    #construtora h1 { font-size: 52px; margin-bottom: 26px; }
    #construtora p {
      font-size: 15px;
      font-weight: 300;
      line-height: 1.85;
      color: var(--text-soft);
    }
    #construtora p + p { margin-top: 16px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px 20px;
      margin-top: 48px;
    }
    .stat-num {
      font-family: var(--font-serif);
      font-size: 34px;
      font-weight: 600;
      line-height: 1.1;
    }
    .stat-lbl {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    .divisor {
      width: 64px; height: 1px;
      background: var(--border);
      margin: 0 auto 70px;
    }

    .titulo-pessoas {
      text-align: center;
      font-size: 34px;
      margin-bottom: 56px;
    }

    /* ── PESSOAS: texto à esquerda, foto à direita, centralizados ── */
    .pessoa {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
      margin-bottom: 80px;
    }
    .pessoa-texto { text-align: left; }
    .pessoa-nome {
      font-family: var(--font-serif);
      font-size: 36px;
      font-weight: 600;
      line-height: 1.15;
    }
    .pessoa-cargo {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .pessoa-bio {
      margin-top: 22px;
      font-size: 15px;
      font-weight: 300;
      line-height: 1.85;
      color: var(--text-soft);
    }
    .pessoa-bio + .pessoa-bio { margin-top: 14px; }
    .pessoa-bio.citacao {
      font-family: var(--font-serif);
      font-size: 20px;
      font-style: italic;
      line-height: 1.5;
      color: var(--dark);
    }
    .pessoa-assinatura {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: 0.04em;
      opacity: 0.75;
    }
    .pessoa-foto {
      justify-self: center;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .pessoa-foto img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }

    footer { height: 40px; }

    @media (max-width: 800px) {
      .wrap { padding: 0 22px; }
      #btn-close { top: 10px; right: 14px; }
      #construtora { padding: 80px 22px 50px; }
      #construtora h1 { font-size: 38px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .pessoa { grid-template-columns: 1fr; gap: 24px; margin-bottom: 56px; }
      .pessoa-foto { order: -1; max-width: 320px; }
      .pessoa-nome { font-size: 30px; }
    }
  </style>
</head>
<body>

<button id="btn-close" title="Fechar" aria-label="Fechar"></button>

<div id="qs-scroll">
  <section id="construtora">
    <h1 id="c-titulo"></h1>
    <div id="c-textos"></div>
  </section>

  <div class="divisor"></div>

  <main class="wrap">
    <h2 class="titulo-pessoas" id="p-titulo"></h2>
    <div id="pessoas"></div>
  </main>
  <footer></footer>
</div>

<script>
// ================================================================
// CONTEÚDO — edite aqui os textos e as pessoas
// ================================================================
const CONTEUDO = {
  construtora: {
    titulo: 'Quem Somos',
    textos: [
      'Há momentos na vida em que o comum deixa de ser suficiente e surge o desejo profundo pelo autêntico, pelo inspirador e pelo impecável.',
      'É exatamente no contexto desse desejo que a Tenório Incorporações firma o seu propósito: construir com ética, inovação e responsabilidade socioambiental empreendimentos que vão muito além da simples moradia, transformando a paisagem urbana e criando verdadeiros estilos de vida.',
      'Uma paixão pela excelência traduzida em um legado construtivo sólido e guiada pela missão de integrar o extraordinário ao cotidiano das pessoas, refletindo personalidade e inspiração.',
    ],
    numeros: [
      { valor: '+45', rotulo: 'anos de atuação' },
      { valor: '+700 mil m²', rotulo: 'de área construída' },
      { valor: '+45', rotulo: 'empreendimentos entregues' },
      { valor: '+2.500', rotulo: 'unidades residenciais e comerciais' },
      { valor: '+R$ 500 mi', rotulo: 'em land bank' },
      { valor: '+2.500', rotulo: 'clientes satisfeitos' },
    ],
  },
  tituloPessoas: 'Quem fez parte',
  // texto: lista de parágrafos (os que começam com “ aparecem como citação)
  // assinatura: linhas opcionais abaixo do texto
  pessoas: [
    { nome: 'Brenda Jeanne', cargo: '', foto: 'assets/Brenda Jeanne.jpeg', texto: [
      'Gosto de criar jardins que sejam sentidos, apreciados e admirados.',
      'Lugares onde seja possível colher frutos, se encantar com as flores, ouvir os pássaros ou simplesmente sentar e contemplar a natureza.',
      'Acredito que um jardim de verdade não é apenas para ser visto. É para fazer parte da vida e nos fazer sentir parte dele.',
    ] },
    {
      nome: 'Scherb Arquitetura', cargo: 'Renata e Yara Scherb — Arquitetas', foto: 'assets/SCHERB ARQUITETURA.png',
      texto: [
        '“Um projeto que nasce do equilíbrio entre sofisticação, conforto e uma nova experiência de morar.”',
        'Com quase 40 anos de arquitetura e mais de 100 obras executadas, assino este empreendimento unindo forma e função, segurança patrimonial, qualidade e autonomia na vida longeva.',
        'Em mais de 20 anos de parceria, projetar para a Tenório Incorporações é sempre pensar em moradia diferenciada e atemporal, onde cada planta foi desenhada para oferecer amplitude, flexibilidade de customização, trazendo a paisagem para dentro de casa.',
        'Mais que um apartamento de 4 quartos, o LEGEND é uma moradia para quem vive intensamente todas as fases da vida: suítes generosas, living ampliado e integrado, varanda gourmet, cozinha funcional e área de serviço inteligente. Acabamentos de alto padrão e esquadrias especiais que garantem ventilação e iluminação natural, ampliando o contato visual com o exterior. Um projeto autoral onde cada metro quadrado foi feito para ser vivido, não apenas ocupado.',
        '“Arquitetura de alto padrão para famílias que crescem e progridem, experimentando a convivência diária num espaço que contribui para o viver bem.”',
      ],
      assinatura: [
        '40 anos | 06 prêmios | +100 obras no mercado imobiliário',
        'Recife e São Paulo | @scherb.arq.br',
      ],
    },
    { nome: 'Filipo Madeira', cargo: '', foto: 'assets/Filipo Madeira.jpeg', texto: ['Com mais de 12 anos de atuação, o Filipo Madeira Arquitetura desenvolve projetos que misturam ousadia, contemporaneidade e brasilidade. Com uma linguagem própria e um olhar sempre voltado para o futuro, o escritório explora formas, materiais e novas maneiras de viver, criando uma arquitetura com personalidade, que foge do óbvio e não busca unanimidade.'] },
    {
      nome: 'Luciana Dias', cargo: 'Arquiteta e Urbanista', foto: 'assets/Luciana Dias.jpeg',
      texto: [
        'Arquiteta e urbanista, Luciana Dias desenvolve projetos que unem estética, funcionalidade e identidade. Com um olhar atento aos detalhes, aos materiais e à integração dos espaços, busca criar ambientes atemporais, sofisticados e acolhedores, traduzindo a essência de cada cliente em projetos que aliam personalidade, conforto e elegância.',
      ],
    },
  ],
};

// ================================================================
// RENDER
// ================================================================
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('c-titulo').textContent = CONTEUDO.construtora.titulo;
document.getElementById('c-textos').innerHTML =
  CONTEUDO.construtora.textos.map(t => `<p>${esc(t)}</p>`).join('') +
  `<div class="stats">${CONTEUDO.construtora.numeros.map(n =>
    `<div><div class="stat-num">${esc(n.valor)}</div><div class="stat-lbl">${esc(n.rotulo)}</div></div>`).join('')}</div>`;
document.getElementById('p-titulo').textContent = CONTEUDO.tituloPessoas;
document.getElementById('pessoas').innerHTML = CONTEUDO.pessoas.map(p => `
  <article class="pessoa">
    <div class="pessoa-texto">
      <h3 class="pessoa-nome">${esc(p.nome)}</h3>
      ${p.cargo ? `<div class="pessoa-cargo">${esc(p.cargo)}</div>` : ''}
      ${p.texto.map(t => `<p class="pessoa-bio${t.startsWith('“') ? ' citacao' : ''}">${esc(t)}</p>`).join('')}
      ${p.assinatura ? `<div class="pessoa-assinatura">${p.assinatura.map(esc).join('<br>')}</div>` : ''}
    </div>
    <div class="pessoa-foto"><img src="${esc(p.foto)}" alt="${esc(p.nome)}" loading="lazy" decoding="async"></div>
  </article>`).join('');

// ── 3DVista close communication ──
document.getElementById('btn-close').addEventListener('click', () => {
  if (window.parent !== window) window.parent.postMessage({ action: 'closeGallery' }, '*');
});
</script>
</body>
</html>
